services:
  app:
    build: .
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/eve-healthcare
      JWT_SECRET: ${JWT_SECRET:-change-me-before-deploying}
      CLIENT_URL: http://localhost:5000
    depends_on:
      mongo:
        condition: service_healthy
  mongo:
    image: mongo:7
    volumes:
      - eve_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  eve_mongo:
